<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cozy Campfire & Music — Aesthetic Night</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <canvas id="canvas"></canvas>

  <div class="top-nav">
    <div class="player-pill">
      <div class="track-meta">
        <div class="wave-visualizer" id="waveViz">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="text-group">
          <span class="track-title" id="trackTitle">Ed Sheeran - Perfect</span>
          <span class="track-sub" id="trackStatus">Now Playing · Cozy Campfire Night</span>
        </div>
      </div>

      <div class="player-controls">
        <button id="prevTrackBtn" class="ctrl-btn icon-btn" title="Previous Track">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>

        <button id="rewindBtn" class="ctrl-btn icon-btn" title="Rewind 10s">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 19l-9-7 9-7v14z"></path>
            <path d="M22 19l-9-7 9-7v14z"></path>
          </svg>
        </button>

        <button id="playBtn" class="ctrl-btn play-main" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
          </svg>
        </button>

        <button id="forwardBtn" class="ctrl-btn icon-btn" title="Forward 10s">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 19l9-7-9-7v14z"></path>
            <path d="M2 19l9-7-9-7v14z"></path>
          </svg>
        </button>

        <button id="nextTrackBtn" class="ctrl-btn icon-btn" title="Next Track">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>

      <div class="source-actions">
        <button id="openYtBtn" class="tag-btn" title="Paste any YouTube song or playlist">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>YouTube</span>
        </button>

        <label class="tag-btn" title="Upload custom song MP3">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>MP3</span>
          <input type="file" id="fileInput" accept="audio/*" style="display:none;">
        </label>
      </div>
    </div>
  </div>

  <div id="ytModal" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Play Any YouTube Song</h3>
        <button id="closeYtModal" class="close-btn">&times;</button>
      </div>
      <p class="modal-desc">Paste any single YouTube Song, Video or Playlist link:</p>
      
      <div class="input-group">
        <input type="text" id="ytUrlInput" placeholder="Paste YouTube link here..." autocomplete="off">
        <button id="loadYtBtn">Play</button>
      </div>

      <div class="preset-playlists">
        <span class="preset-label">Trending Campfire Songs & Presets:</span>
        <button class="preset-btn" data-url="https://www.youtube.com/watch?v=5qap5aO4i9A">☕ Cozy Lofi Campfire Beats</button>
        <button class="preset-btn" data-url="https://www.youtube.com/watch?v=jfKfPfyJRdk">📻 Lofi Girl Chill Radio</button>
        <button class="preset-btn" data-url="https://www.youtube.com/watch?v=DWcJFNfaw9c">🎸 Acoustic Night Guitar Chill</button>
        <button class="preset-btn" data-url="https://www.youtube.com/watch?v=hTWKbfoikeg">🌊 Nirvana - Smells Like Teen Spirit (Acoustic)</button>
      </div>
    </div>
  </div>

  <div id="ytPlayerContainer" style="position:fixed; bottom:-300px; right:-300px; width:200px; height:200px; opacity:0.01; pointer-events:none;">
    <div id="ytPlayer"></div>
  </div>

  <div class="watermark">@codewithanurag</div>

  <!-- BLOC DE NOTAS -->

  <div class="notes-widget" id="notesWidget">
   <div class="notes-header">
      <span>📝 Mis Notas</span>
      <button id="toggleNotesBtn">_</button>
    </div>
<textarea id="notesArea" placeholder="Escribe tus notas aquí..."></textarea>
</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>

</html>
